<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}IONOSPHERE-AI{% endblock %}</title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- =====================================================
         SPACE BACKGROUND
         ===================================================== -->

    <div class="space-bg">
        <div class="stars stars-1"></div>
        <div class="stars stars-2"></div>
        <div class="stars stars-3"></div>

        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
    </div>


    <!-- =====================================================
         COMMAND / NAVIGATION BAR
         ===================================================== -->

    <header class="command-bar">

        <!-- BRAND -->

        <a href="/" class="brand">

            <span class="brand-orbit">
                ◉
            </span>

            <span class="brand-text">

                <strong>
                    IONOSPHERE
                </strong>

                <small>
                    AI / MISSION CONTROL
                </small>

            </span>

        </a>


        <!-- NAVIGATION -->

        <nav class="nav-links">

            <a href="/observatory"
               class="{% if request.path == '/observatory' %}active{% endif %}">
                OBSERVATORY
            </a>

            <a href="/prediction"
               class="{% if request.path == '/prediction' %}active{% endif %}">
                PREDICT
            </a>

            <a href="/analytics"
               class="{% if request.path == '/analytics' %}active{% endif %}">
                DATA TELESCОPE
            </a>

            <a href="/model"
               class="{% if request.path == '/model' %}active{% endif %}">
                MODEL LAB
            </a>

            <a href="/data"
               class="{% if request.path == '/data' %}active{% endif %}">
                DATA CORE
            </a>

            <a href="/history"
               class="{% if request.path == '/history' %}active{% endif %}">
                MISSION LOG
            </a>

        </nav>


        <!-- SYSTEM STATUS -->

        <div class="system-status">

            <span class="status-dot"></span>

            <span>
                SYSTEM ONLINE
            </span>

        </div>

    </header>


    <!-- =====================================================
         MAIN APPLICATION CONTENT
         ===================================================== -->

    <main class="page-container">

        {% block content %}

        {% endblock %}

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="mission-footer">

        <div>
            <strong>
                IONOSPHERE-AI
            </strong>

            <span>
                GPS • TEC • SPACE WEATHER
            </span>
        </div>


        <div class="footer-status">

            <span class="status-dot"></span>

            <span>
                OFFLINE-FIRST OBSERVATORY
            </span>

        </div>

    </footer>


    <!-- =====================================================
         MAIN JAVASCRIPT
         ===================================================== -->

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>


    <!-- Page-specific JavaScript -->

    {% block scripts %}

    {% endblock %}

</body>
</html>
